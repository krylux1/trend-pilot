<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Pilot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
         <h1 class="title">Trend Pilot</h1>

         <p class="subtitle">
             Твоя идея на сегодня. Без скроллинга.
         </p>
         
         <div class="idea" id="idea">
             Нажми кнопку, чтобы получить идею
         </div>
         <div class="buttons">
              
              <button class="button" id="ideaButton">
                  Получить идею
              </button>
              
              <button class="button"
    id="saveButton">
                  Сохранить идею
            </button>

         </div>
       
         <section class="saved-section">
         
               <h2 class="saved-tittle">
                   Сохранёные идеи
               </h2>
            <div id="savedIdeas" class="saved-ideas">

             </div>

         </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
