<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Pilot</title>
    <link rel="icon" type="image/png" sizes="512x512" href="image/favicon 512.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon 32.jpg">
    <script
        data-goatcounter="https://neolead.goatcounter.com/count"
        async
        src="//gc.zgo.at/count.js">
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Экран выбора типа -->
    <div class="type-screen" id="typeScreen">
        <h1 class="title">Trend Pilot</h1>
        <p class="subtitle">Что тебе нужно сейчас?</p>
        <div class="type-buttons">
            <button class="type-btn" data-type="video">🎬 Видео</button>
            <button class="type-btn" data-type="post">✍️ Пост</button>
            <button class="type-btn" data-type="story">📱 Сторис</button>
            <button class="type-btn" data-type="audio">🎙 Аудио</button>
        </div>
    </div>

    <!-- Основной контент -->
    <main class="container" id="mainContent" style="display:none;">
        <h1 class="title">Trend Pilot</h1>
        <p class="subtitle">Твоя идея на сегодня. Без скроллинга.</p>

        <div class="idea" id="idea">
            Нажми кнопку, чтобы получить идею
        </div>

        <div class="buttons">
            <button class="button"
                id="ideaButton"
                data-goatcounter-click="generate_idea">
                Получить идею
            </button>
            <button class="button"
                id="saveButton"
                data-goatcounter-click="save_idea">
                Сохранить идею
            </button>
        </div>

        <button class="change-type" id="changeTypeButton">
            Сменить тип
        </button>

        <section class="saved-section">
            <h2 class="saved-title">Сохранённые идеи</h2>
            <div id="savedIdeas" class="saved-ideas"></div>
        </section>

        <section class="telegram-promo">
            <h2 class="telegram-promo__title">
                Каждый день — новые идеи и путь NeoLead.
            </h2>
            <p class="telegram-promo__text">Подпишись на Telegram</p>
            <a class="telegram-promo__button"
                href="https://t.me/aneolead"
                target="_blank"
                rel="noopener noreferrer">
                Подписаться на Telegram
            </a>
        </section>
    </main>

    <a class="telegram-button"
        href="https://t.me/aneolead"
        target="_blank"
        rel="noopener noreferrer">
        <svg class="telegram-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M21.5 3.5L18.3 20.2C18.1 21.2 17.5 21.5 16.7 21L11.9 17.5L9.6 19.7C9.3 20 9.1 20.2 8.6 20.2L8.9 15.3L17.8 7.3C18.2 7 17.7 6.8 17.3 7.1L6.3 14L1.6 12.5C0.6 12.2 0.6 11.5 1.8 11L20.2 3.9C21.1 3.6 21.9 3.3 21.5 3.5Z" fill="currentColor"/>
        </svg>
        Telegram
    </a>

    <script src="script.js"></script>
</body>
</html>
