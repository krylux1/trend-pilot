<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Pilot</title>
    <link rel="icon" type="image/png" sizes="512x512" href="image/favicon 512.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon 32.jpg">
    <script
        data-goatcounter="https://neolead.goatcounter.com/count"
        async
        src="//gc.zgo.at/count.js">
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Экран выбора типа -->
    <div class="type-screen" id="typeScreen">
        <h1 class="title">Trend Pilot</h1>
        <p class="subtitle">Что тебе нужно сейчас?</p>
        <div class="type-buttons">
            <button class="type-btn" data-type="video">🎬 Видео</button>
            <button class="type-btn" data-type="post">✍️ Пост</button>
            <button class="type-btn" data-type="story">📱 Сторис</button>
            <button class="type-btn" data-type="audio">🎙 Аудио</button>
        </div>
    </div>

    <!-- Экран выбора жанра -->
<div class="genre-screen" id="genreScreen" style="display:none;">
    <h1 class="title">Выбери нишу</h1>
    <p class="subtitle">Под что нужны идеи?</p>
    <div class="genre-buttons">
        <button class="genre-btn" data-genre="game">🎮 Игровая</button>
        <button class="genre-btn" data-genre="life">🌱 Жизненная</button>
        <button class="genre-btn" data-genre="business">💼 Бизнес</button>
        <button class="genre-btn" data-genre="fitness">💪 Фитнес</button>
        <button class="genre-btn" data-genre="education">📚 Образование</button>
        <button class="genre-btn" data-genre="all">🌍 Все</button>
    </div>
</div>

    <!-- Основной контент -->
    <main class="container" id="mainContent" style="display:none;">
        <h1 class="title">Trend Pilot</h1>
        <p class="subtitle">Ассистент для тех, кто создаёт контент.

        </p>

        <div class="idea" id="idea">
            Нажми кнопку, чтобы получить идею
        </div>

        <div class="buttons">
            <button class="button button--primary"
                id="ideaButton"
                data-goatcounter-click="generate_idea">
                Получить идею
            </button>
            <button class="button button--secondary"
                id="saveButton"
                data-goatcounter-click="save_idea">
                Сохранить
            </button>
        </div>  

        <div class="settings-bar">
            <button class="settings-btn" id="changeTypeButton">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
    </svg>
    Формат
</button>

<button class="settings-btn" id="changeGenreButton">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
    </svg>
    Ниша
</button>
        </div>

        <section class="saved-section">
            <h2 class="saved-title">Сохранённые идеи</h2>
            <div id="savedIdeas" class="saved-ideas"></div>
        </section>

        <section class="telegram-promo">
            <h2 class="telegram-promo__title">
                Не знаешь, что снять? Попробуй Trend Pilot.
            </h2>
            <p class="telegram-promo__text">Новые фичи Trend Pilot — в Telegram.</p>
            <a class="telegram-promo__button"
                href="https://t.me/aneolead"
                target="_blank"
                rel="noopener noreferrer">
                Подписаться на Telegram
            </a>
        </section>
    </main>

    

    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
