<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trend Pilot</title>
    <link rel="icon" type="image/png" sizes="512x512" href="image/favicon 512.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="image/favicon 32.jpg">
    <script 
    data-goatcounter="https://neolead.goatcounter.com/count"
    async 
    src="//gc.zgo.at/count.js">
    </script> 

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
         <h1 class="title">Trend Pilot</h1>

         <p class="subtitle">
             Твоя идея на сегодня. Без скроллинга.
         </p>
         
         <div class="idea" id="idea">
             Нажми кнопку, чтобы получить идею
         </div>
         <div class="buttons">
              
              <button class="button" 
              id="ideaButton"
              data-goatcounter-click="generate_idea">
                  Получить идею
              </button>
              
              <button 
                  class="button"
                  id="saveButton"
                  data-goatcounter-click="save_idea">
                  Сохранить идею
            </button>

         </div>
       
         <section class="saved-section">
         
               <h2 class="saved-tittle">
                   Сохранёные идеи
               </h2>
            <div id="savedIdeas" class="saved-ideas">

             </div>

         </section>
         <section class="telegram-promo">
              <h2 class="telegram-promo__title">
                  Каждый день — новые идеи и путь NeoLead.
              </h2>
              
              <p class="telegram-promo__text">
                 Подпишись на Telegram
              </p>
              
              <a class="telegram-promo__button"
              href="https://t.me/+z4__eM9d3VlhZDZi"
              target="_blank"
              rel="noopener noreferrer "
              >
              Подписаться на Telegram
            </a>
         </section>

    </main>

    <script src="script.js"></script>
</body>
<a  class="telegram-button"
    href="https://t.me/+z4__eM9d3VlhZDZi="
    target="_blank"
    rel="noopener noreferrer"
>
    <span class="telegram-icon"></span>
    Telegram
</a>
</html>
